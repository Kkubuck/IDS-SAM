[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idssam"
version = "0.1.0"
description = "IDS-SAM localization and CoBRe/CADER recognition for open-vocabulary camouflaged object segmentation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<3", "numpy>=1.24,<2", "scipy>=1.10,<2",
  "Pillow>=10", "opencv-python-headless>=4.8,<4.12", "PyYAML>=6", "tqdm>=4.66"
]

[project.optional-dependencies]
embedding = ["transformers==4.57.6", "qwen-vl-utils==0.0.14", "accelerate>=0.26,<2", "torchvision>=0.20,<1"]

[project.scripts]
idssam = "idssam.cli.main:main"

[project.urls]
Repository = "https://github.com/Kkubuck/IDS-SAM"
Documentation = "https://github.com/Kkubuck/IDS-SAM/blob/main/docs/GETTING_STARTED.md"
Issues = "https://github.com/Kkubuck/IDS-SAM/issues"

[tool.setuptools.packages.find]
include = ["idssam*"]

[tool.setuptools.package-data]
idssam = ["configs/*.yaml"]
